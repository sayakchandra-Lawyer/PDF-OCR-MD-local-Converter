[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ocr-md-local-converter"
dynamic = ["version"]
description = "Local, private PDF -> Markdown converter (OCR, tables, charts) so Claude Cowork reads cheap Markdown instead of PDFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Sayak Chandra" }]
dependencies = [
    "docling>=2.140,<3",
    "onnxruntime>=1.17",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "pypdfium2>=4.30",
    "pillow>=10",
    "watchdog>=4",
    "mcp>=1.10",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
tesseract = ["tesserocr>=2.7"]
easyocr = ["easyocr>=1.7"]
dev = ["pytest>=8", "reportlab>=4", "matplotlib>=3.8", "build>=1.2", "ruff>=0.6"]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[project.urls]
Homepage = "https://github.com/sayakchandra-Lawyer/PDF-OCR-MD-local-Converter"
Releases = "https://github.com/sayakchandra-Lawyer/PDF-OCR-MD-local-Converter/releases"

[tool.setuptools.dynamic]
# Single source of truth for the version; scripts/build.py keeps the plugin manifests in step.
version = { attr = "pdf2md.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2md = [
    "claude_plugin/.claude-plugin/*.json",
    "claude_plugin/.claude-plugin/*.png",
    "claude_plugin/hooks/*",
    "claude_plugin/skills/*/*",
    "claude_plugin/README.md",
    "claude_plugin/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real Docling models (downloads ~500 MB on first run)"]
